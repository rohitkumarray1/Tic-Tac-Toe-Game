<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tictactoe.in</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div class="msg-container hide">
        <p id="msg"></p>
        <button id="new-game">New Game</button>
    </div>

    <main>
        <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
        <h3 class="score-heading">Score Board</h3>
        <div class="score-board">
            <div class="score">
                <p id="o-score">0</p>
                <p>Player O</p>
            </div>
            <div class="score">
                <p id="x-score">0</p>
                <p>Player X</p>
            </div>
        </div>
        <button id="reset-btn">Reset Game</button>
    </main>

    <script src="app.js"></script>

</body>

</html>
